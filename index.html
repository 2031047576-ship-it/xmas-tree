<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#05060d">
<meta name="description" content="送你一棵会发光的电子圣诞树，点开，抬头看烟花。圣诞快乐 ✨">
<title>圣诞快乐 · 送你一棵电子圣诞树 🎄</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#04050b;overflow:hidden;}
  body{
    position:fixed;top:0;left:0;right:0;bottom:0;
    font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-user-select:none;user-select:none;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    touch-action:none;
  }
  #c{position:fixed;top:0;left:0;right:0;bottom:0;display:block;width:100%;height:100%;}
  .wrap{
    position:fixed;top:0;left:0;right:0;bottom:0;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding-bottom:58px;
    padding-bottom:calc(58px + env(safe-area-inset-bottom,0px));
    pointer-events:none;text-align:center;
    opacity:0;transform:translateY(22px) scale(.97);
    transition:opacity 1.6s cubic-bezier(.22,.9,.24,1),transform 1.6s cubic-bezier(.22,.9,.24,1);
  }
  .wrap.show{opacity:1;transform:none;}
  .cn{
    font-size:clamp(30px,9.6vw,54px);
    line-height:1.16;
    font-weight:800;
    letter-spacing:.14em;
    margin-left:.14em;
    background:linear-gradient(102deg,#ffd79c 0%,#fffdf6 24%,#ffe6b4 40%,#ffc9e6 58%,#fffdf6 78%,#ffd79c 100%);
    background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    text-shadow:0 0 18px rgba(255,186,120,.42),0 0 46px rgba(255,120,190,.28);
    animation:flow 8s linear infinite,breathe 4.8s ease-in-out infinite;
  }
  @keyframes flow{from{background-position:0% 50%}to{background-position:250% 50%}}
  @keyframes breathe{0%,100%{opacity:.93}50%{opacity:1}}
  .en{
    margin-top:11px;
    font-size:clamp(10px,3.1vw,14px);
    font-weight:400;
    letter-spacing:.44em;
    margin-left:.44em;
    color:#ffe3bb;
    opacity:.66;
  }
  .hint{
    position:fixed;left:0;right:0;text-align:center;
    bottom:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
    font-size:12px;letter-spacing:.14em;color:#9db2c9;
    opacity:0;transition:opacity 1s ease;
    pointer-events:none;
  }
  .hint.show{opacity:.72;}
  .hint.gone{opacity:0 !important;}
  .letterHint{
    position:fixed;left:0;right:0;top:63%;
    text-align:center;pointer-events:none;
    opacity:0;transition:opacity 1.2s ease;
  }
  .letterHint.show{opacity:1;}
  .letterHint .t1{
    font-size:clamp(15px,4.2vw,20px);
    letter-spacing:.30em;margin-left:.30em;
    color:#ffe9c8;
    text-shadow:0 0 14px rgba(255,190,120,.5);
  }
  .letterHint .t2{
    margin-top:12px;
    font-size:12px;letter-spacing:.22em;margin-left:.22em;
    color:#a8bccf;
    animation:breathe2 2.4s ease-in-out infinite;
  }
  @keyframes breathe2{0%,100%{opacity:.4}50%{opacity:.95}}
  .credit{
    position:fixed;left:0;right:0;bottom:2px;
    bottom:calc(2px + env(safe-area-inset-bottom,0px));
    text-align:center;font-size:8px;line-height:1;
    letter-spacing:.02em;color:rgba(122,142,168,.55);
    pointer-events:none;
  }
  .veil{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:#000;pointer-events:none;
    opacity:1;transition:opacity 1.5s ease;
    z-index:9;
  }
  .veil.lift{opacity:0;}
  .mute{
    position:fixed;
    top:14px;top:calc(14px + env(safe-area-inset-top,0px));
    right:14px;
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.14);
    border-radius:50%;
    background:rgba(255,255,255,.05);
    color:#ffe0b8;
    opacity:.55;
    transition:opacity .3s ease;
    cursor:pointer;
  }
  .mute:active{opacity:.9;}
  .mute svg{display:block;}
  .mute .slash{opacity:0;transition:opacity .2s;}
  .mute.muted .slash{opacity:1;}
  .mute.muted .wave{opacity:0;}
  @media (orientation:landscape){
    .wrap{justify-content:center;align-items:flex-end;padding-right:8vw;padding-bottom:0;}
    .cn{font-size:clamp(22px,4.2vw,42px);}
  }
</style>
</head>

<script>
(function(){
'use strict';

var TAU = Math.PI * 2;
var cvs = document.getElementById('c');
var ctx = cvs.getContext('2d', { alpha: false });
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
var hintEl = document.getElementById('hint');
var wrapEl = document.getElementById('wrap');
var muteEl = document.getElementById('mute');
var letterHintEl = document.getElementById('letterHint');

/* ================= 时间轴（秒） ================= */
var T_CONV     = 0.60;

var T_GARLAND_END = 4.20;
var T_STAR     = 4.30;
var T_TEXT     = 4.55;
var T_SNOW     = 4.65;
var T_PLAY     = 5.95;

var W = 0, H = 0, DPR = 1;
var T = 0, ti = 0, T0 = 0, spin = 0, lastT = 0, raf = 0;
var phase = 'letter', textShown = false, hintMode = -1, hintHidden = false;
var letterT0 = -1, letterK = 0, entered = false;
var bg = null, groundGrad = null, coneGrad = null, tree = null;
var dots = [], stars = [], snow = [], parts = [], flashes = [], rings = [];
var glints = [], flies = [], motes = [], meteors = [], cometTrail = [], pines = [];
var cometDone = false;
var slowMode = false, perfAcc = 0, perfN = 0;
var nextFire = 0;
var finaleNext = 0, finaleFlash = 0, pending = [];
var snowAcc = 0;
var snowSpecks = [];
var snowGrad = null, groundBaseGrad = null;

var rnd = Math.random;
function rand(a, b){ return a + rnd() * (b - a); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function easeOutCubic(x){ x = 1 - x; return 1 - x * x * x; }
function easeOutBack(x){ var c1 = 1.70158, c3 = c1 + 1; var p = x - 1; return 1 + c3 * p * p * p + c1 * p * p; }

/* ================= 贴图 ================= */
function makeSprite(rgb){
  var S = 32, c = document.createElement('canvas');
  c.width = c.height = S * 2;
  var g = c.getContext('2d');
  var gr = g.createRadialGradient(S, S, 0, S, S, S);
  gr.addColorStop(0.00, 'rgba(' + rgb + ',1)');
  gr.addColorStop(0.14, 'rgba(' + rgb + ',0.86)');
  gr.addColorStop(0.38, 'rgba(' + rgb + ',0.26)');
  gr.addColorStop(0.70, 'rgba(' + rgb + ',0.05)');
  gr.addColorStop(1.00, 'rgba(' + rgb + ',0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, S * 2, S * 2);
  return c;
}
function hsl2rgb(h, s, l){
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  var c = (1 - Math.abs(2 * l - 1)) * s;
  var x = c * (1 - Math.abs((h / 60) % 2 - 1));
  var m = l - c / 2, r = 0, g = 0, b = 0;
  var i = Math.floor(h / 60) % 6;
  if(i === 0){ r = c; g = x; } else if(i === 1){ r = x; g = c; }
  else if(i === 2){ g = c; b = x; } else if(i === 3){ g = x; b = c; }
  else if(i === 4){ r = x; b = c; } else { r = c; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}
function rgbStr(v){ return 'rgb(' + v[0] + ',' + v[1] + ',' + v[2] + ')'; }

var SP = {
  white: makeSprite('255,255,255'),
  warm : makeSprite('255,226,176'),
  gold : makeSprite('255,196,92'),
  pink : makeSprite('255,122,192'),
  mint : makeSprite('128,255,196'),
  cyan : makeSprite('130,224,255'),
  red  : makeSprite('255,86,96')
};
var HUE_SP = [];
(function(){
  for(var i = 0; i < 12; i++){
    var c = hsl2rgb(i * 30, 88, 70);
    HUE_SP.push(makeSprite(c[0] + ',' + c[1] + ',' + c[2]));
  }
})();
var SNOW_SP = (function(){
  var S = 32, c = document.createElement('canvas');
  c.width = c.height = S * 2;
  var g = c.getContext('2d');
  var gr = g.createRadialGradient(S, S, 0, S, S, S);
  gr.addColorStop(0.00, 'rgba(255,255,255,0.95)');
  gr.addColorStop(0.30, 'rgba(240,248,255,0.55)');
  gr.addColorStop(0.62, 'rgba(220,235,255,0.14)');
  gr.addColorStop(1.00, 'rgba(220,235,255,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, S * 2, S * 2);
  return c;
})();

var TREE_POOL = ['white','warm','white','mint','pink','white','cyan','warm','gold','white'];
var ORN_POOL  = ['gold','red','pink','cyan'];

var _hbuf = new Float32Array(3 * 160);

/* ================= 布局 ================= */
function layout(){
  W = cvs.clientWidth || window.innerWidth;
  H = cvs.clientHeight || window.innerHeight;
  if(!W || W < 2) W = window.innerWidth;
  if(!H || H < 2) H = window.innerHeight;

  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width  = Math.max(1, Math.round(W * DPR));
  cvs.height = Math.max(1, Math.round(H * DPR));

  var land = W > H * 1.2;
  var Ht, cy;
  if(land){ Ht = Math.min(H * 0.80, W * 0.52); cy = H * 0.50; }
  else   { Ht = Math.min(H * 0.56, W * 1.15); cy = H * 0.44; }
  var R0 = Ht * 0.355;

  tree = {
    cx: W * 0.5, cy: cy, H: Ht, R: R0,
    topY: cy - Ht * 0.5,
    botY: cy + Ht * 0.5,
    k: Ht / 620
  };

  buildTree();
  buildStars();
  buildSnow();
  buildMeteors();
  buildFlies();
  buildMotes();
  buildPines();
  buildEnvelope();
  buildBG();
  buildGround();

  parts.length = 0;
  flashes.length = 0;
  rings.length = 0;
  glints.length = 0;
  cometTrail.length = 0;
  lastT = 0;
}

function buildTree(){
  var t = tree, i, u, key, orn;
  dots = [];
  var M = Math.round(Math.min(430, Math.max(190, t.H * 0.72)));
  if(slowMode) M = Math.round(M * 0.62);
  var ornIdx = 0;
  for(i = 0; i < M; i++){
    u = Math.sqrt(rnd());
    orn = rnd() < 0.07;
    key = orn ? ORN_POOL[(rnd() * ORN_POOL.length) | 0]
              : TREE_POOL[(rnd() * TREE_POOL.length) | 0];
    dots.push({
      u: u,
      a0: rnd() * TAU,
      rj: 0.78 + rnd() * 0.36,
      sz: (orn ? rand(5.2, 8.4) : rand(2.2, 4.6)) * t.k,
      ph: rnd() * TAU,
      branch: 0.90 + 0.13 * Math.sin(u * 13.7 + (orn ? 1 : 0)),
      orn: orn,
      on: orn ? (2.28 + (ornIdx++) * 0.07 + rnd() * 0.1) : 0,
      fly: rnd() < 0.13,
      fa: rnd() * TAU,
      sa: rnd() * TAU,
      sr: 1.05 + rnd() * 1.45,
      sp: SP[key]
    });
  }
}

function buildStars(){
  stars = [];
  var n = Math.round(Math.min(160, Math.max(55, W * H / 8800)));
  for(var i = 0; i < n; i++){
    var r = rnd();
    stars.push({
      x: rnd() * W,
      y: rnd() * H * 0.92,
      s: r < 0.13 ? 2 : 1.2,
      ph: rnd() * TAU,
      sp: rand(0.5, 1.9),
      b: rand(0.16, 0.85)
    });
  }
}

function buildSnow(){
  snow = [];
  var n = Math.round(Math.min(110, Math.max(46, W * H / 5200)));
  if(slowMode) n = Math.round(n * 0.6);
  for(var i = 0; i < n; i++){
    var z = rnd();                       // 0 远 .. 1 近
    var rr = 0.6 + z * z * 2.4;
    snow.push({
      x: rnd() * W,
      y: rnd() * H,
      z: z,
      r: rr * rand(1.2, 2.2) * (W / 400),
      vy: (9 + z * 34) * rand(0.8, 1.2),
      amp: rand(6, 22) * (0.4 + z),
      ph: rnd() * TAU,
      sp: rand(0.3, 1.0),
      a: (0.55 - z * 0.42) * rand(0.7, 1.1),
      t0: 0.25 + rnd() * 2.6
    });
  }
  snowSpecks = [];
  for(var j = 0; j < 16; j++){
    snowSpecks.push({ u: (j + rand(0.15, 0.85)) / 16, ph: rnd() * TAU, sp: rand(0.8, 2.0), r: rand(1.1, 2.2) });
  }
}

function buildMeteors(){
  meteors = [];
  for(var i = 0; i < 3; i++){
    meteors.push({
      t0: 0.05 + i * 0.30,
      dur: 0.50 + rnd() * 0.22,
      x0: W * (0.60 + i * 0.16), y0: -30 - rnd() * 60,
      x1: W * (0.06 + i * 0.12), y1: H * (0.20 + rnd() * 0.14)
    });
  }
}

function buildFlies(){
  flies = [];
  var n = 20;
  for(var i = 0; i < n; i++){
    flies.push({
      r: tree.R * rand(0.75, 1.5),
      h: rand(0.15, 1.02),
      sp: rand(0.12, 0.35) * (rnd() < 0.5 ? 1 : -1),
      ph: rnd() * TAU,
      sz: rand(1.6, 3.4) * tree.k,
      bob: rand(0.5, 1.6)
    });
  }
}

function buildMotes(){
  motes = [];
  for(var i = 0; i < 26; i++){
    motes.push({
      ux: rand(-0.25, 1.25),
      uy: rnd(),
      vy: rand(0.025, 0.070),
      ph: rnd() * TAU,
      sp: rand(0.35, 1.1),
      r: rand(0.9, 2.4),
      a: rand(0.25, 0.6)
    });
  }
}

function buildBG(){
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(W * DPR));
  c.height = Math.max(1, Math.round(H * DPR));
  var g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);

  var lg = g.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, '#070c1a');
  lg.addColorStop(0.40, '#05060f');
  lg.addColorStop(1, '#010206');
  g.fillStyle = lg;
  g.fillRect(0, 0, W, H);

  function blob(x, y, r, rgb, a){
    var rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, 'rgba(' + rgb + ',' + a + ')');
    rg.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = rg;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  var M = Math.max(W, H);
  blob(W * 0.50, H * 0.28, M * 0.60, '38,110,130', 0.22);
  blob(W * 0.14, H * 0.08, W * 0.74, '88,54,138', 0.16);
  blob(W * 0.90, H * 0.58, W * 0.64, '152,46,92', 0.12);
  blob(W * 0.50, H * 0.22, M * 0.30, '120,90,60', 0.06);

  var vg = g.createRadialGradient(W * 0.5, H * 0.42, Math.min(W, H) * 0.14,
                                  W * 0.5, H * 0.50, Math.max(W, H) * 0.86);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.84)');
  g.fillStyle = vg;
  g.fillRect(0, 0, W, H);

  bg = c;
}

function buildGround(){
  var t = tree;
  groundGrad = ctx.createRadialGradient(t.cx, t.botY, 0, t.cx, t.botY, t.R * 2.6);
  groundGrad.addColorStop(0, 'rgba(255,186,120,0.34)');
  groundGrad.addColorStop(0.26, 'rgba(120,255,190,0.15)');
  groundGrad.addColorStop(0.60, 'rgba(88,120,255,0.06)');
  groundGrad.addColorStop(1, 'rgba(0,0,0,0)');

  coneGrad = ctx.createRadialGradient(t.cx, t.cy, t.R * 0.1, t.cx, t.cy, t.R * 2.1);
  coneGrad.addColorStop(0, 'rgba(90,255,190,0.13)');
  coneGrad.addColorStop(0.5, 'rgba(60,180,200,0.05)');
  coneGrad.addColorStop(1, 'rgba(0,0,0,0)');

  var gy = t.botY + 12 * t.k;
  groundBaseGrad = ctx.createLinearGradient(0, gy - 30, 0, gy + 90);
  groundBaseGrad.addColorStop(0.00, 'rgba(30,40,64,0)');
  groundBaseGrad.addColorStop(0.25, 'rgba(30,40,64,0.13)');
  groundBaseGrad.addColorStop(0.60, 'rgba(16,22,38,0.06)');
  groundBaseGrad.addColorStop(1.00, 'rgba(2,3,8,0)');

  snowGrad = ctx.createLinearGradient(0, gy - 40, 0, gy + 110);
  snowGrad.addColorStop(0.000, 'rgba(226,240,255,0)');
  snowGrad.addColorStop(0.267, 'rgba(232,244,255,0.90)');
  snowGrad.addColorStop(0.340, 'rgba(208,226,250,0.72)');
  snowGrad.addColorStop(0.530, 'rgba(146,172,214,0.26)');
  snowGrad.addColorStop(0.790, 'rgba(60,76,110,0.07)');
  snowGrad.addColorStop(1.000, 'rgba(6,8,16,0)');
}

/* 积雪表面（x 处的雪面高度） */
function snowSurfaceY(x){
  var t = tree;
  var gy = t.botY + 12 * t.k;
  var k = snowAcc;
  var u = x / W;
  var prof = 0.32 + 0.68 * Math.pow(Math.abs(Math.sin(u * 3.15 + 0.55)), 0.75);
  var grow = k * H * 0.052 * prof;
  return gy - grow
       + Math.sin(u * 11.3 + 2.1) * (3 + 8 * k)
       + Math.sin(u * 19.7 - 0.6) * (2 + 5 * k);
}

function drawSnowGround(){
  var t = tree, i, x, sx, sy, tw;
  var gy = t.botY + 12 * t.k;
  var a = Math.min(1, snowAcc * 2.6);

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  /* 裸地：一开始就要能看出"地" */
  ctx.beginPath();
  ctx.moveTo(-20, gy);
  ctx.lineTo(W + 20, gy);
  ctx.lineTo(W + 20, H + 10);
  ctx.lineTo(-20, H + 10);
  ctx.closePath();
  ctx.fillStyle = groundBaseGrad;
  ctx.fill();

  if(snowAcc > 0.015){
    ctx.globalAlpha = a;

    ctx.beginPath();
    ctx.moveTo(-20, snowSurfaceY(-20));
    for(x = 8; x <= W + 20; x += 8) ctx.lineTo(x, snowSurfaceY(x));
    ctx.lineTo(W + 20, H + 10);
    ctx.lineTo(-20, H + 10);
    ctx.closePath();
    ctx.fillStyle = snowGrad;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-20, snowSurfaceY(-20));
    for(x = 8; x <= W + 20; x += 8) ctx.lineTo(x, snowSurfaceY(x));
    ctx.strokeStyle = 'rgba(226,240,255,0.16)';
    ctx.lineWidth = 8;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(238,248,255,0.34)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* 树上的暖光洒在雪面上 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.32 * Math.min(1, snowAcc * 2.0);
  ctx.save();
  ctx.translate(t.cx, t.botY);
  ctx.scale(1, 0.34);
  ctx.translate(-t.cx, -t.botY);
  ctx.fillStyle = groundGrad;
  ctx.beginPath();
  ctx.arc(t.cx, t.botY, t.R * 2.1, 0, TAU);
  ctx.fill();
  ctx.restore();

  /* 雪面细闪 */
  if(snowAcc > 0.03){
    for(i = 0; i < snowSpecks.length; i++){
      var sp = snowSpecks[i];
      sx = sp.u * W;
      sy = snowSurfaceY(sx) + sp.r * 2.2;
      tw = 0.35 + 0.65 * Math.max(0, Math.sin(T * sp.sp + sp.ph));
      drawDot(SP.white, sx, sy, sp.r * (0.8 + 0.5 * tw), a * tw * 0.5);
    }
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
}

/* ================= 基础绘制 ================= */
function drawDot(sp, x, y, r, a){
  if(!(r > 0.05) || !(a > 0.004)) return;
  ctx.globalAlpha = a > 1 ? 1 : a;
  ctx.drawImage(sp, x - r, y - r, r * 2, r * 2);
}

function buildPines(){
  pines = [[], []];
  for(var layer = 0; layer < 2; layer++){
    var arr = [];
    var n = layer === 0 ? 11 : 8;
    for(var i = 0; i < n; i++){
      arr.push({
        u: (i + rand(0.1, 0.9)) / n,
        h: (layer === 0 ? 0.070 : 0.120) * rand(0.55, 1.2),
        w: (layer === 0 ? 0.062 : 0.092) * rand(0.7, 1.3)
      });
    }
    arr.sort(function(p, q){ return p.u - q.u; });
    pines[layer] = arr;
  }
}

function drawAurora(){
  var bands = [
    { y: 0.105, h: 0.115, a: 0.020, sp: 0.085, ph: 0.0, c: '70,255,190' },
    { y: 0.155, h: 0.150, a: 0.028, sp: -0.062, ph: 1.9, c: '132,116,255' },
    { y: 0.070, h: 0.090, a: 0.015, sp: 0.045, ph: 3.4, c: '110,225,255' }
  ];
  for(var b = 0; b < bands.length; b++){
    var B = bands[b];
    var baseY = H * B.y;
    var amp = H * B.a;
    var hh = H * B.h;
    var x, yb, first;

    var g = ctx.createLinearGradient(0, baseY - hh - amp * 2, 0, baseY + amp);
    g.addColorStop(0, 'rgba(' + B.c + ',0)');
    g.addColorStop(0.5, 'rgba(' + B.c + ',0.065)');
    g.addColorStop(1, 'rgba(' + B.c + ',0.22)');
    ctx.fillStyle = g;

    ctx.beginPath();
    first = true;
    for(x = -20; x <= W + 20; x += 14){
      yb = baseY
         + Math.sin(x / W * 2.6 + T * B.sp + B.ph) * amp
         + Math.sin(x / W * 5.3 - T * B.sp * 1.4 + B.ph * 2) * amp * 0.45;
      if(first){ ctx.moveTo(x, yb); first = false; }
      else ctx.lineTo(x, yb);
    }
    for(x = W + 20; x >= -20; x -= 14){
      yb = baseY - hh
         + Math.sin(x / W * 2.2 + T * B.sp * 0.8 + B.ph + 1) * amp * 0.8;
      ctx.lineTo(x, yb);
    }
    ctx.closePath();
    ctx.fill();
  }
}

function drawScenery(){
  var t = tree;
  var baseY = t.botY + 8 * t.k;
  var i, p, x, h, w, layer, arr;

  /* 月亮 */
  var mx = W * 0.80, my = H * 0.115, mr = W * 0.055;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.22;
  ctx.drawImage(SP.white, mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
  ctx.globalAlpha = 0.50;
  ctx.drawImage(SP.white, mx - mr * 1.9, my - mr * 1.9, mr * 3.8, mr * 3.8);
  ctx.globalAlpha = 0.85;
  ctx.drawImage(SP.white, mx - mr * 1.05, my - mr * 1.05, mr * 2.1, mr * 2.1);

  /* 远景松林剪影 */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  for(layer = 0; layer < 2; layer++){
    arr = pines[layer];
    if(!arr) continue;
    ctx.fillStyle = layer === 0 ? 'rgba(36,50,78,0.50)' : 'rgba(17,26,44,0.88)';
    for(i = 0; i < arr.length; i++){
      p = arr[i];
      x = p.u * W;
      h = p.h * H;
      w = p.w * W;
      ctx.beginPath();
      ctx.moveTo(x, baseY - h);
      ctx.lineTo(x + w * 0.5, baseY);
      ctx.lineTo(x - w * 0.5, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x, baseY - h * 0.58);
      ctx.lineTo(x + w * 0.78, baseY);
      ctx.lineTo(x - w * 0.78, baseY);
      ctx.closePath();
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'lighter';
}

function drawStars(){  ctx.globalAlpha = 1;
  ctx.fillStyle = '#cfe0ff';
  for(var i = 0; i < stars.length; i++){
    var s = stars[i];
    var a = s.b * (0.45 + 0.55 * Math.sin(T * s.sp + s.ph));
    if(a <= 0.02) continue;
    ctx.globalAlpha = a;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
}

function drawGround(prog){
  if(prog <= 0) return;
  var t = tree;
  ctx.save();
  ctx.translate(t.cx, t.botY);
  ctx.scale(1, 0.42);
  ctx.translate(-t.cx, -t.botY);
  ctx.globalAlpha = 0.9 * prog;
  ctx.fillStyle = groundGrad;
  ctx.beginPath();
  ctx.arc(t.cx, t.botY, t.R * 2.6, 0, TAU);
  ctx.fill();
  ctx.restore();

  ctx.globalAlpha = 0.55 * prog;
  ctx.fillStyle = coneGrad;
  ctx.beginPath();
  ctx.arc(t.cx, t.cy, t.R * 2.1, 0, TAU);
  ctx.fill();
}

/* ================= 圣诞树 ================= */
function drawTree(dt, prog){
  var t = tree, i, u, ang, rr, z, dep, x, y, a, sz, n, off, s, d, flow, wave, uu, lit, flashK, pop;

  spin += dt * 0.32;

  var N = slowMode ? 70 : 96;
  var STR = 5;
  var iStart = Math.ceil((1 - prog) * N);
  if(iStart < 0) iStart = 0;

  /* 光带：从底部长到顶 */
  for(s = 0; s < STR; s++){
    off = s * TAU / STR;
    n = 0;
    for(i = 0; i <= N; i++){
      u = i / N;
      ang = off + u * TAU * 3.05 + spin;
      rr = t.R * Math.pow(u, 0.94);
      z = Math.cos(ang);
      _hbuf[n * 3]     = t.cx + Math.sin(ang) * rr;
      _hbuf[n * 3 + 1] = t.topY + u * t.H + Math.sin(u * 7 + T * 0.7) * 1.3 * t.k;
      _hbuf[n * 3 + 2] = (z + 1) * 0.5;
      n++;
    }

    if(iStart < n - 1){
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.moveTo(_hbuf[iStart * 3], _hbuf[iStart * 3 + 1]);
      for(i = iStart + 1; i < n; i++) ctx.lineTo(_hbuf[i * 3], _hbuf[i * 3 + 1]);
      ctx.strokeStyle = 'rgba(110,255,190,0.14)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    for(i = iStart; i < n; i += 2){
      uu = i / (n - 1);
      dep = _hbuf[i * 3 + 2];
      wave = Math.pow(0.5 + 0.5 * Math.sin((uu * 2.7 - T * 0.55) * TAU), 5);
      a = 0.14 + 0.55 * dep + wave * 0.75;
      sz = (2.4 + 3.2 * dep + wave * 4.6) * t.k;
      var head = (i === iStart);
      if(head){ a = 0.92; sz *= 1.7; }
      drawDot(s < 3 ? SP.warm : SP.mint, _hbuf[i * 3], _hbuf[i * 3 + 1], sz, a);
      if(head) drawDot(SP.white, _hbuf[i * 3], _hbuf[i * 3 + 1], sz * 0.72, 0.7);
    }
  }

  /* 粒子 */
  for(i = 0; i < dots.length; i++){
    d = dots[i];
    if(slowMode && (i & 1)) continue;
    u = d.u;

    ang = d.a0 + spin + u * 2.4;
    rr = t.R * u * d.rj * d.branch;
    x = t.cx + Math.sin(ang) * rr;
    z = Math.cos(ang);
    dep = (z + 1) * 0.5;
    y = t.topY + u * t.H + Math.sin(u * 6.2 - T * 1.1 + d.ph) * 2.4 * t.k;

    var sc, al;
    if(d.orn){
      if(ti < d.on) continue;
      var ok = clamp((ti - d.on) / 0.50, 0, 1);
      al = clamp(ok * 3, 0, 1);
      sc = easeOutBack(ok);
    } else {
      var local = 1 - u;
      var ck = clamp((prog - local * 0.90) / 0.115, 0, 1);
      if(ck <= 0) continue;
      al = ck;
      sc = easeOutBack(ck);
      if(d.fly && ck < 1){
        var f2 = 1 - ck;
        var offR = t.R * 1.9 * f2;
        x += Math.cos(d.fa) * offR;
        y += Math.sin(d.fa) * offR;
        if(f2 > 0.04){
          ctx.globalAlpha = 0.16 * ck;
          ctx.strokeStyle = 'rgba(200,228,255,1)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x - Math.cos(d.fa) * 26 * f2, y - Math.sin(d.fa) * 26 * f2);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
      }
    }

    flow = 0.5 + 0.5 * Math.sin((u * 6.5 - T * 1.35) * TAU + d.ph);
    a = (0.20 + 0.80 * dep) * (0.55 + 0.80 * flow) * al;
    /* 每颗灯自己的慢速呼吸，避免整棵树一起亮暗 */
    a *= 0.80 + 0.20 * Math.sin(T * 1.55 + d.ph * 2.3);
    sz = d.sz * (0.50 + 1.00 * dep) * sc;

    drawDot(d.sp, x, y, sz, a);
    if(sc > 1.02) drawDot(SP.white, x, y, sz * 0.5, Math.min(0.7, (sc - 1) * 1.6));

    if(al > 0.9 && rnd() < 0.00012 && glints.length < 6){
      glints.push({ x: x, y: y, t0: T, sp: d.sp });
    }
  }

  /* 扫光前沿 */
  if(prog > 0 && prog < 1){
    var fy = t.topY + (1 - prog) * t.H;
    ctx.globalAlpha = 0.26;
    ctx.drawImage(SP.mint, t.cx - t.R * 1.3, fy - 32 * t.k, t.R * 2.6, 64 * t.k);
  }
}

function drawGlints(dt){
  for(var i = glints.length - 1; i >= 0; i--){
    var g = glints[i];
    var life = (T - g.t0) / 0.75;
    if(life >= 1){ glints.splice(i, 1); continue; }
    var k = Math.sin(life * Math.PI);
    var L = 9 * k * tree.k + 2.5;
    ctx.globalAlpha = k * 0.85;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = Math.max(1, 1.1 * tree.k);
    ctx.beginPath();
    ctx.moveTo(g.x - L, g.y); ctx.lineTo(g.x + L, g.y);
    ctx.moveTo(g.x, g.y - L); ctx.lineTo(g.x, g.y + L);
    ctx.stroke();
    drawDot(SP.white, g.x, g.y, 3.4 * k * tree.k + 1.2, k * 0.9);
  }
}

function drawFlies(){
  if(ti < T_TEXT + 0.7) return;
  var fade = clamp((ti - T_TEXT - 0.7) / 1.2, 0, 1);
  var t = tree;
  for(var i = 0; i < flies.length; i++){
    var f = flies[i];
    var ang = f.ph + T * f.sp;
    var y = t.botY - f.h * t.H + Math.sin(T * f.bob + f.ph) * 6 * t.k;
    var x = t.cx + Math.sin(ang) * f.r;
    var a = (0.35 + 0.35 * Math.sin(T * 2.2 + f.ph * 3)) * fade;
    drawDot(SP.warm, x, y, f.sz * (0.8 + 0.4 * Math.sin(T * 1.7 + f.ph)), a);
  }
}

function drawMotes(dt){
  var t = tree;
  for(var i = 0; i < motes.length; i++){
    var m = motes[i];
    m.uy += m.vy * dt;
    if(m.uy > 1.12){ m.uy = -0.12; m.ux = rand(-0.25, 1.25); }
    var x = t.cx + (m.ux - 0.5) * t.R * 2.5 + Math.sin(T * m.sp + m.ph) * 9 * t.k;
    var y = t.topY + m.uy * t.H;
    var fade = Math.sin(Math.PI * clamp((m.uy + 0.12) / 1.24, 0, 1));
    var a = m.a * fade * (0.55 + 0.45 * Math.sin(T * 2.1 + m.ph * 2));
    if(a <= 0.01) continue;
    drawDot(SP.warm, x, y, m.r * t.k + 0.7, a);
  }
}

function drawGifts(k){
  if(k <= 0) return;
  var t = tree;
  var list = [
    { u: -0.62, s: 0.76, body: '#7d2430', rib: '#ffd27a' },
    { u: -0.34, s: 0.52, body: '#215761', rib: '#ffe0a0' },
    { u:  0.56, s: 0.66, body: '#522765', rib: '#ffd27a' }
  ];
  for(var i = 0; i < list.length; i++){
    var g = list[i];
    var s = g.s * 30 * t.k;
    var x = t.cx + g.u * t.R;
    var by = t.botY + 5 * t.k;
    var a = k;

    ctx.globalCompositeOperation = 'lighter';
    drawDot(SP.warm, x, by - s * 0.5, s * 2.4, 0.12 * a);

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = a;

    roundRect(x - s, by - s * 1.05, s * 2, s * 1.05, s * 0.16);
    ctx.fillStyle = g.body;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,160,0.30)';
    ctx.lineWidth = 1;
    ctx.stroke();

    /* 缎带 */
    ctx.fillStyle = g.rib;
    ctx.globalAlpha = a * 0.9;
    ctx.fillRect(x - s * 0.16, by - s * 1.05, s * 0.32, s * 1.05);
    ctx.fillRect(x - s, by - s * 0.62, s * 2, s * 0.28);

    /* 蝴蝶结 */
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.ellipse ? ctx.ellipse(x - s * 0.34, by - s * 1.12, s * 0.34, s * 0.20, -0.4, 0, TAU)
                : ctx.arc(x - s * 0.34, by - s * 1.12, s * 0.28, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse ? ctx.ellipse(x + s * 0.34, by - s * 1.12, s * 0.34, s * 0.20, 0.4, 0, TAU)
                : ctx.arc(x + s * 0.34, by - s * 1.12, s * 0.28, 0, TAU);
    ctx.fill();

    /* 盒顶一层薄雪 */
    ctx.globalAlpha = a * 0.7;
    ctx.fillStyle = 'rgba(228,242,255,0.92)';
    ctx.beginPath();
    ctx.ellipse ? ctx.ellipse(x, by - s * 1.04, s * 0.94, s * 0.13, 0, 0, TAU)
                : ctx.arc(x, by - s * 1.04, s * 0.3, 0, TAU);
    ctx.fill();

    ctx.globalCompositeOperation = 'lighter';
  }
}

function drawStar(pop){
  var t = tree;
  if(pop <= 0) return;
  var sy = t.topY - t.H * 0.035;
  var pulse = 0.72 + 0.28 * Math.sin(T * 2.1);
  var k = t.k * pop;

  /* 星星向上升起的一束柔光 */
  var bh = t.H * (0.60 + 0.07 * Math.sin(T * 0.9));
  var bw = t.R * (0.90 + 0.14 * Math.sin(T * 0.6));
  ctx.globalAlpha = 0.055 * clamp(pop, 0, 1) * (0.75 + 0.25 * pulse);
  ctx.drawImage(SP.warm, t.cx - bw / 2, sy - bh, bw, bh * 1.08);

  drawDot(SP.gold, t.cx, sy, 30 * k * pulse, 0.50);
  drawDot(SP.warm, t.cx, sy, 13 * k * pulse, 0.85);
  drawDot(SP.white, t.cx, sy, 5.2 * k, 1);

  var rot = T * 0.35;
  ctx.globalAlpha = (0.15 + 0.20 * pulse) * clamp(pop, 0, 1);
  ctx.strokeStyle = 'rgba(255,226,170,1)';
  ctx.lineWidth = Math.max(1, 1.2 * k);
  for(var i = 0; i < 8; i++){
    var ang = rot + i * TAU / 8;
    var L = (24 + 18 * Math.pow(0.5 + 0.5 * Math.sin(T * 2.1 + i), 3)) * k;
    ctx.beginPath();
    ctx.moveTo(t.cx + Math.cos(ang) * 6 * k, sy + Math.sin(ang) * 6 * k);
    ctx.lineTo(t.cx + Math.cos(ang) * L, sy + Math.sin(ang) * L);
    ctx.stroke();
  }
}

/* ================= 流星（点缀） ================= */
function drawMeteors(){
  for(var i = 0; i < meteors.length; i++){
    var m = meteors[i];
    if(ti < m.t0 || ti > m.t0 + m.dur + 0.1) continue;
    var k = clamp((ti - m.t0) / m.dur, 0, 1);
    for(var j = 9; j >= 0; j--){
      var kk = k - j * 0.035;
      if(kk <= 0) continue;
      var x = m.x0 + (m.x1 - m.x0) * kk;
      var y = m.y0 + (m.y1 - m.y0) * kk;
      var a = (1 - j / 10) * (1 - k) * 0.5;
      drawDot(SP.cyan, x, y, (1.6 - j * 0.12) * tree.k + 0.6, a);
    }
  }
}

/* ================= 信封 ================= */
var ENV = null;

function buildEnvelope(){
  var w = Math.min(W * 0.70, 336);
  var h = w * 0.64;
  var cy = H * 0.40;
  ENV = {
    cx: W * 0.5, cy: cy, w: w, h: h,
    L: W * 0.5 - w / 2, R: W * 0.5 + w / 2,
    T: cy - h / 2, B: cy + h / 2
  };
  ENV.shadow = ctx.createRadialGradient(ENV.cx, ENV.B + h * 0.16, 0, ENV.cx, ENV.B + h * 0.16, w * 0.66);
  ENV.shadow.addColorStop(0, 'rgba(0,0,0,0.55)');
  ENV.shadow.addColorStop(1, 'rgba(0,0,0,0)');
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawLetter(){
  var e = ENV;
  if(!e) return;
  var k = letterK;
  var bob = Math.sin(T * 1.5) * 5 * (H / 800);
  var pulse = 0.5 + 0.5 * Math.sin(T * 2.1);
  var mouthY = e.T + e.h * 0.52;
  var i;

  /* 背后光晕 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.40 + 0.22 * pulse;
  var gw = e.w * 2.6, gh = e.h * 3.4;
  ctx.drawImage(SP.gold, e.cx - gw / 2, e.cy - gh / 2 + bob, gw, gh);

  /* 信封 */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.save();
  ctx.translate(e.cx, e.cy + bob);
  var sc = 1 + k * 0.18;
  ctx.scale(sc, sc);
  ctx.translate(-e.cx, -e.cy);

  var L = e.L, R = e.R, Tp = e.T, Bt = e.B, cx = e.cx, w = e.w, h = e.h;

  /* 地面投影 */
  ctx.beginPath();
  ctx.ellipse ? ctx.ellipse(cx, Bt + h * 0.16, w * 0.62, h * 0.16, 0, 0, TAU)
              : ctx.arc(cx, Bt + h * 0.16, w * 0.62, 0, TAU);
  ctx.fillStyle = e.shadow;
  ctx.fill();

  roundRect(L, Tp, w, h, h * 0.07);
  var bg1 = ctx.createLinearGradient(0, Tp, 0, Bt);
  bg1.addColorStop(0, '#2b3762');
  bg1.addColorStop(0.45, '#18203c');
  bg1.addColorStop(1, '#0b1020');
  ctx.fillStyle = bg1;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,214,160,0.40)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,214,160,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(L, Bt); ctx.lineTo(cx, mouthY);
  ctx.moveTo(R, Bt); ctx.lineTo(cx, mouthY);
  ctx.stroke();

  var apexY = mouthY - k * (h * 1.02);
  var sh = 1 - k * 0.16;
  ctx.beginPath();
  ctx.moveTo(cx + (L - cx) * sh, Tp);
  ctx.lineTo(cx + (R - cx) * sh, Tp);
  ctx.lineTo(cx, apexY);
  ctx.closePath();
  var bg2 = ctx.createLinearGradient(0, Tp - h * 0.6, 0, mouthY);
  bg2.addColorStop(0, '#43518a');
  bg2.addColorStop(0.55, '#313d6b');
  bg2.addColorStop(1, '#242e52');
  ctx.fillStyle = bg2;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,214,160,0.32)';
  ctx.stroke();

  var sa = Math.max(0, 1 - k * 2.6);
  if(sa > 0.01){
    var sr = h * 0.135 * (1 + k * 0.9);
    ctx.globalAlpha = sa;
    ctx.fillStyle = 'rgba(150,52,58,0.95)';
    ctx.beginPath(); ctx.arc(cx, mouthY, sr, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,196,110,0.85)';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(cx, mouthY, sr, 0, TAU); ctx.stroke();
    ctx.globalAlpha = sa * 0.9;
    drawDot(SP.gold, cx, mouthY, sr * 0.85, 1);
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  /* 开信的光 */
  if(k > 0){
    ctx.globalCompositeOperation = 'lighter';
    var bx = e.cx, by = mouthY + bob;
    ctx.globalAlpha = Math.min(1, k * 1.4) * 0.9;
    var rr = e.w * (0.30 + k * 1.1);
    ctx.drawImage(SP.warm, bx - rr, by - rr, rr * 2, rr * 2);

    var rot = T * 0.7;
    ctx.strokeStyle = 'rgba(255,235,200,1)';
    ctx.lineWidth = 1.3;
    for(i = 0; i < 10; i++){
      var a2 = rot + i * TAU / 10;
      var L2 = e.w * (0.25 + k * 0.55) * (0.65 + 0.35 * Math.sin(T * 3 + i));
      ctx.globalAlpha = 0.22 * k;
      ctx.beginPath();
      ctx.moveTo(bx + Math.cos(a2) * e.w * 0.08, by + Math.sin(a2) * e.w * 0.08);
      ctx.lineTo(bx + Math.cos(a2) * L2, by + Math.sin(a2) * L2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  ctx.globalCompositeOperation = 'lighter';
}

/* ================= 烟花 ================= */
function launch(x, y){
  var d = (H + 10) - y;
  if(d < 40) d = 40;
  var g = 2 * d / (1.5 * 60) / (1.5 * 60);
  parts.push({
    kind: 0, x: x, y: H + 10, px: x, py: H + 10,
    vx: rand(-0.22, 0.22), vy: -Math.sqrt(2 * g * d), ty: y,
    hue: rnd() * 360, g: g
  });
  sfxWhistle(x);
}

function burst(x, y, hue, power){
  var n = Math.round(rand(62, 104) * (power || 1));
  if(slowMode) n = Math.round(n * 0.62);
  var kind = rnd();
  var spd = rand(1.15, 2.25);
  var willow = rnd() < 0.13;
  var sh = rnd();
  var sType = sh < 0.09 ? 1 : (sh < 0.15 ? 2 : 0);   /* 1=心形 2=五角星 */
  if(sType) { n = Math.max(n, 96); willow = false; }
  var i, a, v, hh, col, pk, r0, vx2, vy2;

  for(i = 0; i < n; i++){
    a = (i / n) * TAU + rand(-0.05, 0.05);
    if(sType === 1){
      var tt2 = (i / n) * TAU;
      var hx = 16 * Math.pow(Math.sin(tt2), 3);
      var hy2 = -(13 * Math.cos(tt2) - 5 * Math.cos(2 * tt2) - 2 * Math.cos(3 * tt2) - Math.cos(4 * tt2));
      var mm = Math.sqrt(hx * hx + hy2 * hy2) || 1;
      var sc2 = spd * 2.7 / 17;
      vx2 = hx * sc2; vy2 = hy2 * sc2;
    } else if(sType === 2){
      var aS = (i / n) * TAU;
      var phi = aS - Math.PI / 2;
      var lobe = 0.5 + 0.5 * Math.cos(5 * phi);
      var rS = 0.40 + 0.60 * Math.pow(lobe, 2.2);
      var sc3 = spd * 2.1;
      vx2 = Math.cos(phi) * rS * sc3;
      vy2 = Math.sin(phi) * rS * sc3;
    } else {
      if(kind < 0.18)      v = spd * rand(0.93, 1.04);
      else if(kind < 0.58) v = spd * Math.pow(rnd(), 0.30);
      else                 v = spd * Math.pow(rnd(), 0.65);
      vx2 = Math.cos(a) * v;
      vy2 = Math.sin(a) * v;
    }

    hh = hue + (sType ? rand(-6, 6) : rand(-16, 16));
    col = hsl2rgb(hh, 88, rand(68, 86));
    pk = Math.floor((((Math.round(hh) % 360) + 360) % 360) / 30) % 12;
    r0 = rand(2, 9);

    parts.push({
      kind: 1, x: x + Math.cos(a) * r0, y: y + Math.sin(a) * r0, px: x, py: y,
      vx: vx2, vy: vy2,
      col: rgbStr(col), sp: HUE_SP[pk],
      g: willow ? rand(0.055, 0.078) : rand(0.026, 0.042),
      drag: willow ? 0.988 : 0.972,
      life: 1,
      dec: willow ? rand(0.0062, 0.0092) : rand(0.0065, 0.0125),
      w: rand(1.2, 2.0),
      gl: rnd() < 0.45,
      tw: rnd() < 0.28,
      ph: rnd() * TAU
    });
  }
  /* 炸开后的金色余烬，慢慢飘落闪烁 */
  for(i = 0; i < 9; i++){
    var ga = rnd() * TAU, gv = rand(0.25, 0.95);
    parts.push({
      kind: 1, x: x, y: y, px: x, py: y,
      vx: Math.cos(ga) * gv, vy: Math.sin(ga) * gv - 0.25,
      col: 'rgb(255,238,198)', sp: SP.gold,
      g: 0.012, drag: 0.9925, life: 1, dec: 0.0042,
      w: 1.3, gl: true, tw: true, ph: rnd() * TAU
    });
  }

  flashes.push({ x: x, y: y, r: 6, a: 1, sp: SP.warm });
  sfxBoom(x, power);
}

function stepFireworks(dtf){
  var i, p, a, dr, k;
  for(i = parts.length - 1; i >= 0; i--){
    p = parts[i];

    if(p.kind === 0){
      p.py = p.y;
      p.vy += p.g * dtf;
      p.y  += p.vy * dtf;
      p.x  += p.vx * dtf;

      for(k = 1; k <= 6; k++){
        drawDot(SP.warm, p.x, p.y - p.vy * 1.8 * k * 0.30,
                (3.6 - k * 0.42) * tree.k + 1, 0.55 - k * 0.07);
      }
      drawDot(SP.warm, p.x, p.y, 4.2 * tree.k + 1.6, 0.95);

      if(p.vy > -0.55 || p.y <= p.ty){
        burst(p.x, p.y, p.hue, 1);
        parts.splice(i, 1);
      }
      continue;
    }

    p.px = p.x; p.py = p.y;
    dr = Math.pow(p.drag, dtf);
    p.vx *= dr;
    p.vy = p.vy * dr + p.g * dtf;
    p.x += p.vx * dtf;
    p.y += p.vy * dtf;
    p.life -= p.dec * dtf;

    if(p.life <= 0 || p.y > H + 80){ parts.splice(i, 1); continue; }

    a = p.life < 0.5 ? p.life * 2 : 1;
    if(p.tw) a *= 0.55 + 0.45 * Math.sin(T * 26 + p.ph);
    if(a <= 0.01) continue;

    ctx.globalAlpha = a;
    ctx.strokeStyle = p.col;
    ctx.lineWidth = p.w;
    ctx.beginPath();
    ctx.moveTo(p.x - p.vx * 1.6, p.y - p.vy * 1.6);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();

    if(p.gl) drawDot(p.sp, p.x, p.y, p.w * 3.6, a * 0.7);
  }
}

function stepFlashes(dt){
  var i, f, rr;
  for(i = flashes.length - 1; i >= 0; i--){
    f = flashes[i];
    f.r += dt * 430;
    f.a -= dt * 2.9;
    if(f.a <= 0){ flashes.splice(i, 1); continue; }
    rr = f.r < 1 ? 1 : f.r;
    ctx.globalAlpha = Math.min(0.50, f.a * 0.45);
    ctx.drawImage(f.sp, f.x - rr, f.y - rr, rr * 2, rr * 2);
  }
}

function stepRings(dt){
  var i, g;
  for(i = rings.length - 1; i >= 0; i--){
    g = rings[i];
    g.r += g.vr * dt;
    g.a -= dt * 1.9;
    if(g.a <= 0){ rings.splice(i, 1); continue; }
    ctx.globalAlpha = g.a * 0.45;
    ctx.strokeStyle = 'rgba(255,226,180,1)';
    ctx.lineWidth = g.w;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r, 0, TAU);
    ctx.stroke();
  }
}

function finale(){
  var i;
  for(i = 0; i < 7; i++){
    pending.push({ t: T + i * 0.17 + rnd() * 0.08, x: rand(W * 0.10, W * 0.90), y: rand(H * 0.06, H * 0.34) });
  }
  for(i = 0; i < 3; i++){
    burst(rand(W * 0.15, W * 0.85), rand(H * 0.08, H * 0.30), rnd() * 360, 1.15);
  }
  finaleFlash = 1;
}

function autoFire(dt){
  if(finaleNext <= 0) finaleNext = T + 26;
  if(T >= finaleNext){
    finaleNext = T + 30;
    finale();
  }
  if(pending.length){
    for(var k = pending.length - 1; k >= 0; k--){
      if(T >= pending[k].t){
        launch(pending[k].x, pending[k].y);
        pending.splice(k, 1);
      }
    }
  }
  nextFire -= dt;
  if(nextFire > 0) return;
  nextFire = rand(0.9, 2.2);
  if(parts.length > 680) return;
  launch(rand(W * 0.12, W * 0.88), rand(H * 0.09, H * 0.36));
}

/* ================= 雪 ================= */
function stepSnow(dt){
  var wind = Math.sin(T * 0.21) * 16 + Math.sin(T * 0.07 + 1.3) * 11;
  var landed = 0;
  for(var i = 0; i < snow.length; i++){
    var s = snow[i];
    var on = clamp((ti - T_SNOW - s.t0) / 0.9, 0, 1);
    if(on <= 0) continue;
    s.y += s.vy * dt;
    s.x += (wind * (0.35 + s.z) + Math.sin(T * s.sp + s.ph) * 10 * (0.4 + s.z)) * dt;
    if(s.x > W + 30) s.x = -30;
    if(s.x < -30) s.x = W + 30;
    if(s.y > snowSurfaceY(s.x)){
      s.y = -20 - rnd() * 40;
      s.x = rnd() * W;
      landed++;
    }
    var a = s.a * on * (0.7 + 0.3 * Math.sin(T * 1.6 + s.ph * 2));
    if(a <= 0.012) continue;
    drawDot(SNOW_SP, s.x, s.y, s.r, a);
  }
  if(snowAcc < 1){
    var ramp = clamp((ti - T_SNOW) / 6, 0, 1);
    snowAcc = Math.min(1, snowAcc + (0.014 + landed * 0.0035) * dt * ramp);
  }
}

/* ================= 音频 ================= */
var AC = null, master = null, mus = null, conv = null, send = null, fxBus = null, musicSrc = null;
var started = false, audioOn = false, muted = false;
var schedTimer = 0, nextNote = 0, stepIdx = 0, lastBoom = -1;
var BANK = { boom1: null, boom2: null, whistle: null };

function makeIR(seconds, decay){
  var rate = AC.sampleRate;
  var len = Math.floor(rate * seconds);
  var buf = AC.createBuffer(2, len, rate);
  for(var ch = 0; ch < 2; ch++){
    var d = buf.getChannelData(ch);
    for(var i = 0; i < len; i++){
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  return buf;
}

function b64buf(b64){
  var bin = atob(b64), n = bin.length, u = new Uint8Array(n);
  for(var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}

function initAudio(){
  if(started) return true;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return false;
  try { AC = new Ctx(); } catch(e){ return false; }
  started = true;

  master = AC.createGain();
  master.gain.value = 0.0001;
  master.connect(AC.destination);

  conv = AC.createConvolver();
  conv.buffer = makeIR(2.6, 2.4);
  send = AC.createGain();
  send.gain.value = 0.32;
  send.connect(conv);
  conv.connect(master);

  mus = AC.createGain();
  mus.gain.value = 0.9;
  mus.connect(master);
  mus.connect(send);

  fxBus = AC.createGain();
  fxBus.gain.value = 0.85;
  fxBus.connect(master);

  var data = window.SFX_DATA || {};
  (function(){
    for(var k in data){
      if(!data[k]) continue;
      (function(key){
        try {
          AC.decodeAudioData(b64buf(data[key]), function(ab){ BANK[key] = ab; }, function(){});
        } catch(e){}
      })(k);
    }
  })();

  return true;
}

function beginMusic(){
  if(audioOn) return;
  audioOn = true;
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setValueAtTime(0.0001, AC.currentTime);
  master.gain.exponentialRampToValueAtTime(muted ? 0.0001 : 0.34, AC.currentTime + 2.0);

  /* 优先用真实录制的音乐；解码失败再退回合成 */
  if(BANK.music){
    try{
      var src = AC.createBufferSource();
      src.buffer = BANK.music;
      src.loop = true;
      var mg = AC.createGain();
      mg.gain.value = 0.44;
      src.connect(mg);
      mg.connect(master);
      src.start(0);
      musicSrc = src;
    }catch(e){ musicSrc = null; }
  }
  if(!musicSrc){
    nextNote = AC.currentTime + 0.25;
    stepIdx = 0;
    if(!schedTimer) schedTimer = setInterval(schedule, 120);
  }
  muteEl.classList.toggle('muted', muted);
  updateHint();
}

/* 尽量一进页面就响；浏览器/微信禁止自动播放时，第一次触碰立刻响 */
function attemptAudio(){
  if(audioOn) return;
  if(!initAudio()) return;
  var p = null;
  if(AC.state === 'suspended'){ try { p = AC.resume(); } catch(e){} }
  var check = function(){
    if(audioOn || !AC) return;
    if(AC.state === 'running') beginMusic();
  };
  if(p && p.then){ try { p.then(check, function(){}); } catch(e){} }
  setTimeout(check, 50);
  setTimeout(check, 400);
  check();
}

function sfxReady(){ return AC && audioOn && !muted; }

function playSample(name, gain, rate, pan){
  if(!sfxReady()) return;
  var b = BANK[name];
  if(!b) return;
  var s = AC.createBufferSource();
  s.buffer = b;
  s.playbackRate.value = rate || 1;
  var g = AC.createGain();
  g.gain.value = gain;
  s.connect(g);
  if(AC.createStereoPanner && pan !== undefined){
    var p = AC.createStereoPanner();
    p.pan.value = clamp(pan, -1, 1);
    g.connect(p); p.connect(fxBus);
  } else {
    g.connect(fxBus);
  }
  s.start(AC.currentTime + 0.002);
}

function sfxBoom(x, power){
  if(!sfxReady()) return;
  var now = AC.currentTime;
  if(now - lastBoom < 0.06) return;
  lastBoom = now;
  var name = rnd() < 0.6 ? 'boom1' : 'boom2';
  var g = (name === 'boom1' ? 0.62 : 0.5) * (0.7 + (power || 1) * 0.3);
  playSample(name, Math.min(1.1, g), 0.9 + rnd() * 0.2, (x / W) * 1.6 - 0.8);
}

function sfxWhistle(x){
  if(!sfxReady()) return;
  playSample('whistle', 0.42, 0.95 + rnd() * 0.1, (x / W) * 1.6 - 0.8);
}

function sfxOpen(){
  if(!sfxReady()) return;
  playSample('paper', 0.95, 0.97 + rnd() * 0.06, 0);
}

/* ---------- 音乐 ---------- */
var NOTE = {
  'C3':130.81,'D3':146.83,'E3':164.81,'F3':174.61,'G3':196.00,'A3':220.00,'B3':246.94,
  'C4':261.63,'D4':293.66,'E4':329.63,'F4':349.23,'G4':392.00,'A4':440.00,'B4':493.88,
  'C5':523.25,'E5':659.25,'G5':783.99,'C6':1046.50,'E6':1318.51,'G6':1567.98
};
var EIGHTH = 0.225;

var MEL = [];
(function(){
  MEL.push(['E4',2],['E4',2],['E4',2],[0,2]);
  MEL.push(['E4',2],['E4',2],['E4',2],[0,2]);
  MEL.push(['E4',2],['G4',2],['C4',2],['D4',2]);
  MEL.push(['E4',6],[0,2]);
  MEL.push(['F4',2],['F4',2],['F4',2],[0,2]);
  MEL.push(['F4',2],['E4',2],['E4',2],[0,2]);
  MEL.push(['E4',2],['D4',2],['D4',2],['E4',2]);
  MEL.push(['D4',4],['G4',4]);
  var half = MEL.slice(0);
  MEL = half.concat(half);
})();

var STEPS = [];
(function(){
  for(var i = 0; i < MEL.length; i++){
    var f = MEL[i][0] ? NOTE[MEL[i][0]] : 0;
    for(var j = 0; j < MEL[i][1]; j++) STEPS.push(j === 0 ? f : 0);
  }
})();

var CHORDS = [
  ['C4','E4','G4'], ['C4','E4','G4'], ['C4','E4','G4'], ['C4','E4','G4'],
  ['F4','A4','C5'], ['C4','E4','G4'], ['G3','B3','D4'], ['C4','E4','G4']
];
var BASS = ['C3','C3','C3','C3','F3','C3','G3','C3'];

function schedule(){
  if(!AC || !audioOn) return;
  if(muted){ nextNote = AC.currentTime + 0.05; return; }
  if(nextNote < AC.currentTime - 0.25) nextNote = AC.currentTime + 0.05;
  while(nextNote < AC.currentTime + 0.7){
    var sw = (stepIdx & 1) ? 0.035 : 0;
    playStep(stepIdx, nextNote + sw);
    nextNote += EIGHTH;
    stepIdx = (stepIdx + 1) % STEPS.length;
  }
}

function playStep(i, t){
  var bar = i >> 3, sub = i & 7;
  if(sub === 0) pad(CHORDS[bar % 8], t, EIGHTH * 8 * 0.95, 0.045);
  if(sub % 2 === 0) bassNote(NOTE[BASS[bar % 8]], t, EIGHTH * 1.7, 0.085);
  if(sub === 4) bassNote(NOTE[BASS[bar % 8]] * 1.5, t, EIGHTH * 1.4, 0.045);
  if(sub % 2 === 0) shaker(t, sub === 0 ? 0.035 : 0.020);
  var f = STEPS[i];
  if(f) bell(f, t, 1.05, 0.26);
  if((bar % 4) === 3 && sub === 6) sparkle(t);
}

function partial(f, t, dur, vol){
  var o = AC.createOscillator();
  o.type = 'sine';
  o.frequency.value = f;
  var g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(mus);
  o.start(t); o.stop(t + dur + 0.05);
}

function bell(f, t, dur, vol){
  partial(f, t, dur, vol);
  partial(f * 2.01, t, dur * 0.55, vol * 0.30);
  partial(f * 3.02, t, dur * 0.32, vol * 0.12);
}

function bassNote(f, t, dur, vol){
  var o = AC.createOscillator();
  o.type = 'triangle';
  o.frequency.value = f;
  var lp = AC.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 620;
  var g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(lp); lp.connect(g); g.connect(mus);
  o.start(t); o.stop(t + dur + 0.05);
}

function pad(freqs, t, dur, vol){
  for(var i = 0; i < freqs.length; i++){
    var f = NOTE[freqs[i]];
    var o = AC.createOscillator();
    o.type = 'triangle';
    o.frequency.value = f * (1 + (i - 1) * 0.0012);
    var o2 = AC.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = f * 2;
    var lp = AC.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1200;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * 0.28);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(mus);
    o.start(t); o.stop(t + dur + 0.06);
    o2.start(t); o2.stop(t + dur + 0.06);
  }
}

function shaker(t, vol){
  var s = AC.createBufferSource();
  var len = Math.floor(AC.sampleRate * 0.09);
  var nb = AC.createBuffer(1, len, AC.sampleRate);
  var d = nb.getChannelData(0);
  for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  s.buffer = nb;
  var bp = AC.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 6200; bp.Q.value = 1.1;
  var g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.085);
  s.connect(bp); bp.connect(g); g.connect(mus);
  s.start(t); s.stop(t + 0.1);
}

function sparkle(t){
  var seq = ['C6','E6','G6'];
  for(var i = 0; i < seq.length; i++) bell(NOTE[seq[i]], t + i * 0.07, 0.7, 0.075);
}

/* ---------- 开场音效 ---------- */
function sfxGliss(){
  if(!sfxReady()) return;
  var seq = ['C4','E4','G4','C5','E5','G5','C6','E6','G6'];
  var t0 = AC.currentTime + 0.02;
  var span = 1.70;
  for(var i = 0; i < seq.length; i++){
    var tt = t0 + (i / seq.length) * span;
    bell(NOTE[seq[i]], tt, 0.9, 0.16);
  }
}

function sfxChime(){
  if(!sfxReady()) return;
  var t = AC.currentTime + 0.01;
  var ch = ['C5','E5','G5','C6'];
  for(var i = 0; i < ch.length; i++) bell(NOTE[ch[i]], t + i * 0.055, 2.2, 0.20);
  sparkle(t + 0.25);
}

function sfxText(){
  if(!sfxReady()) return;
  var t = AC.currentTime + 0.01;
  bell(NOTE['G4'], t, 1.1, 0.15);
  bell(NOTE['C5'], t + 0.11, 1.5, 0.13);
}

var sfxFlags = {};
function introSfx(){
  if(!sfxReady() || phase === 'letter') return;
  if(!sfxFlags.conv && ti >= T_CONV){
    sfxFlags.conv = 1;
    if(ti < T_CONV + 0.5) sfxGliss();
  }
  if(!sfxFlags.star && ti >= T_STAR){
    sfxFlags.star = 1;
    if(ti < T_STAR + 0.45) sfxChime();
  }
  if(!sfxFlags.text && ti >= T_TEXT){
    sfxFlags.text = 1;
    if(ti < T_TEXT + 0.5) sfxText();
  }
}

/* ================= 提示 ================= */
function updateHint(){
  if(!hintEl || hintHidden) return;
  if(phase === 'letter'){
    if(hintMode !== -2){ hintMode = -2; hintEl.className = 'hint'; }
    return;
  }
  var mode = (phase === 'play' ? 2 : 0) + (audioOn ? 1 : 0);
  if(mode === hintMode) return;
  hintMode = mode;
  if(mode === 0) hintEl.textContent = '🔊 点一下屏幕 · 音乐马上响';
  else if(mode === 1) hintEl.textContent = '✨ 灯火正在亮起…';
  else if(mode === 2) hintEl.textContent = '🔊 点一下 · 音乐和烟花一起';
  else hintEl.textContent = '轻触屏幕 · 放一朵烟花 ✨';
  hintEl.classList.add('show');
}

/* ================= 主循环 ================= */
function frame(now){
  raf = requestAnimationFrame(frame);

  if(!lastT) lastT = now;
  var dt = (now - lastT) / 1000;
  lastT = now;
  if(dt > 0.08) dt = 0.08;
  if(dt < 0) dt = 0;

  T += dt;
  var dtf = dt * 60;
  if(dtf > 2.2) dtf = 2.2;

  if(!slowMode){
    if(dt < 0.05){ perfAcc += dt; perfN++; }
    if(perfN >= 120){
      if(perfAcc / perfN > 0.030){ slowMode = true; buildTree(); buildSnow(); }
      perfAcc = 0; perfN = 0;
    }
  }

  if(phase === 'letter'){
    if(letterT0 >= 0){
      letterK = clamp((T - letterT0) / 0.85, 0, 1);
      if(letterK >= 1 && !entered){
        entered = true;
        phase = 'intro';
        T0 = T;
        ti = 0;
        updateHint();
      }
    }
  } else {
    ti = T - T0;
  }

  var prog = clamp((ti - T_GARLAND) / (T_GARLAND_END - T_GARLAND), 0, 1);

  if(phase === 'intro' && ti >= T_PLAY){
    phase = 'play';
    nextFire = 0.9;
    burst(rand(W * 0.2, W * 0.8), rand(H * 0.10, H * 0.30), rnd() * 360, 1.1);
    updateHint();
  }
  if(!textShown && phase !== 'letter' && ti >= T_TEXT){
    textShown = true;
    if(wrapEl) wrapEl.className = 'wrap show';
  }
  updateHint();

  var cam = 1;
  if(phase !== 'letter' && ti < 4.4) cam = 0.94 + 0.06 * easeOutCubic(clamp(ti / 4.4, 0, 1));

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.drawImage(bg, 0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';

  if(phase === 'letter'){
    drawLetter();
  } else {
    drawAurora();
    drawStars();
    drawMeteors();
    drawScenery();
    stepSnow(dt);

    ctx.save();
    ctx.translate(tree.cx, tree.cy);
    ctx.scale(cam, cam);
    ctx.translate(-tree.cx, -tree.cy);

    drawGround(clamp((ti - 1.2) / 1.0, 0, 1));

    /* 树周围的呼吸光晕 */
    var halo = (0.10 + 0.035 * Math.sin(T * 0.9)) * clamp((ti - 1.0) / 1.6, 0, 1);
    if(halo > 0.002){
      ctx.globalAlpha = halo;
      var hw = tree.R * 3.2, hh = tree.H * 1.35;
      ctx.drawImage(SP.gold, tree.cx - hw / 2, tree.cy - hh / 2, hw, hh);
    }

    drawTree(dt, prog);
    drawMotes(dt);
    drawGifts(clamp((ti - 3.4) / 1.4, 0, 1) * clamp((ti - 0.6) / 2.0, 0, 1));
    drawGlints(dt);
    drawFlies();
    var starPop = ti >= T_STAR ? easeOutBack(clamp((ti - T_STAR) / 0.55, 0, 1)) : 0;
    drawStar(starPop);
    ctx.restore();

    drawSnowGround();

    /* 雪地上的灯火倒影 */
    if(snowAcc > 0.04){
      var shim = 0.075 * Math.min(1, snowAcc * 3);
      for(var si = 0; si < 7; si++){
        var ux2 = (si - 3) / 3.0;
        var sx2 = tree.cx + ux2 * tree.R * 1.15;
        var sy2 = snowSurfaceY(sx2) + 3;
        var ww = tree.R * 0.22;
        var hh2 = tree.R * 0.62 * (1 - Math.abs(ux2) * 0.42);
        var fl = 0.55 + 0.45 * Math.sin(T * 1.5 + si * 1.9);
        ctx.globalAlpha = shim * fl;
        ctx.drawImage(si % 2 ? SP.mint : SP.warm, sx2 - ww / 2, sy2 - hh2 * 0.12, ww, hh2);
      }
    }

    /* 通向树下的脚印 */
    if(snowAcc > 0.32){
      var fa = clamp((snowAcc - 0.32) / 0.30, 0, 1);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(62,88,124,0.55)';
      for(var fi = 0; fi < 7; fi++){
        var fu = fi / 6;
        var fx = W * (0.05 + fu * 0.30) + Math.sin(fu * 3.4) * 12;
        var fy = snowSurfaceY(fx) + 12 + fu * 22;
        var fr = 2.8 + fu * 1.7;
        ctx.globalAlpha = fa * (0.45 + 0.35 * Math.sin(fi * 2.1));
        ctx.beginPath();
        if(ctx.ellipse) ctx.ellipse(fx + (fi % 2 ? 7 : -7), fy, fr, fr * 0.55, 0.22, 0, TAU);
        else ctx.arc(fx, fy, fr, 0, TAU);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'lighter';
    }

    /* 结尾文字背后的暖光 */
    if(textShown){
      var tg = (0.045 + 0.02 * Math.sin(T * 1.25)) * clamp((ti - T_TEXT) / 1.2, 0, 1);
      var tgw = W * 1.3, tgh = H * 0.36;
      ctx.globalAlpha = tg;
      ctx.drawImage(SP.warm, W / 2 - tgw / 2, H * 0.855 - tgh / 2, tgw, tgh);
    }
  }

  stepFireworks(dtf);
  stepFlashes(dt);
  stepRings(dt);
  if(phase === 'play') autoFire(dt);

  /* 高潮时的整体提亮 */
  if(finaleFlash > 0){
    finaleFlash = Math.max(0, finaleFlash - dt * 1.5);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = finaleFlash * 0.07;
    ctx.fillStyle = '#ffe9c8';
    ctx.fillRect(0, 0, W, H);
  }

  /* 开场白闪 */
  if(phase === 'intro' && ti < 0.40){
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = Math.pow(1 - ti / 0.40, 1.4) * 0.92;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ================= 交互 ================= */
function tapAt(x, y){
  if(phase !== 'play') return;
  burst(x, y, rnd() * 360, 1.15);
  try{ if(navigator.vibrate) navigator.vibrate(14); }catch(e){}
  if(hintMode === 3){
    hintHidden = true;
    hintMode = -1;
    hintEl.className = 'hint gone';
    setTimeout(function(){ if(hintEl) hintEl.style.display = 'none'; }, 1200);
  }
}

function onDown(e){
  var x, y;
  if(e && e.touches && e.touches.length){
    x = e.touches[0].clientX; y = e.touches[0].clientY;
  } else if(e){
    x = e.clientX; y = e.clientY;
  }
  attemptAudio();
  if(phase === 'letter'){ openLetter(); return; }
  if(x === undefined || x === null) return;
  tapAt(x, y);
}

function openLetter(){
  if(phase !== 'letter' || letterT0 >= 0) return;
  letterT0 = T;
  attemptAudio();
  sfxOpen();
  if(letterHintEl) letterHintEl.className = 'letterHint';
  try{ if(navigator.vibrate) navigator.vibrate(18); }catch(e){}
}

var DOWNEVT = window.PointerEvent ? 'pointerdown' : 'touchstart';
document.addEventListener(DOWNEVT, onDown, { passive: true });
if(!window.PointerEvent) document.addEventListener('mousedown', onDown, { passive: true });

muteEl.addEventListener(DOWNEVT, function(e){
  e.stopPropagation();
  muted = !muted;
  muteEl.classList.toggle('muted', muted);
  if(AC && master){
    master.gain.cancelScheduledValues(AC.currentTime);
    master.gain.setValueAtTime(Math.max(0.0001, master.gain.value), AC.currentTime);
    master.gain.exponentialRampToValueAtTime(muted ? 0.0001 : 0.34, AC.currentTime + 0.35);
  }
  e.preventDefault();
}, { passive: false });

document.addEventListener('touchmove', function(e){
  if(e.touches && e.touches.length > 1) e.preventDefault();
}, { passive: false });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, { passive: false });

/* ================= 生命周期 ================= */
var rt = 0;
function scheduleLayout(){
  clearTimeout(rt);
  rt = setTimeout(layout, 200);
}
window.addEventListener('resize', scheduleLayout);
window.addEventListener('orientationchange', function(){ setTimeout(layout, 350); });
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', scheduleLayout);
}

document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    if(raf) cancelAnimationFrame(raf);
    raf = 0;
    if(AC && AC.state === 'running'){ try{ AC.suspend(); }catch(e){} }
  } else {
    if(!raf){ lastT = 0; raf = requestAnimationFrame(frame); }
    if(AC && audioOn && !muted){ try{ AC.resume(); }catch(e){} }
  }
});
window.addEventListener('pageshow', function(){
  if(!raf){ lastT = 0; raf = requestAnimationFrame(frame); }
});

layout();
initAudio();
updateHint();
if(letterHintEl) letterHintEl.className = 'letterHint show';
raf = requestAnimationFrame(frame);

var veilEl = document.getElementById('veil');
if(veilEl){
  setTimeout(function(){ veilEl.classList.add('lift'); }, 110);
  setTimeout(function(){ veilEl.style.display = 'none'; }, 1900);
}

})();
</script>
</body>
